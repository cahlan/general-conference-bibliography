<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conference Bibliography</title>
<meta name="description" content="Who gets quoted in LDS general conference: a reverse bibliography of every talk since 1971.">
<style>
  :root {
    color-scheme: light;
    --bg: #fcfcfb; --surface: #ffffff; --surface-2: #f3f2ee; --border: #e3e1da;
    --text: #0b0b0b; --text-2: #52514e; --text-3: #8a8880;
    --accent: #2a78d6; --accent-soft: #cde2fb; --series-2: #eb6834; --series-3: #1baf7a; --series-4: #eda100;
    --grid: #ebe9e3; --bar: #2a78d6; --bar-muted: #9ec5f4;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #141413; --surface: #1a1a19; --surface-2: #232321; --border: #33332f;
      --text: #ffffff; --text-2: #c3c2b7; --text-3: #8f8e86;
      --accent: #3987e5; --accent-soft: #1c3b63; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500;
      --grid: #2a2a27; --bar: #3987e5; --bar-muted: #2f5a8f;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #141413; --surface: #1a1a19; --surface-2: #232321; --border: #33332f;
    --text: #ffffff; --text-2: #c3c2b7; --text-3: #8f8e86;
    --accent: #3987e5; --accent-soft: #1c3b63; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500;
    --grid: #2a2a27; --bar: #3987e5; --bar-muted: #2f5a8f;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
  header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); border-bottom: 1px solid var(--border); }
  .bar { max-width: 1180px; margin: 0 auto; padding: 10px 16px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  .brand { font-weight: 700; font-size: 17px; letter-spacing: -.01em; color: var(--text); }
  .brand small { font-weight: 400; color: var(--text-3); margin-left: 8px; }
  nav a { margin-right: 14px; color: var(--text-2); font-weight: 500; } nav a.active { color: var(--text); border-bottom: 2px solid var(--accent); padding-bottom: 2px; }
  .search { margin-left: auto; position: relative; }
  .search input { width: 280px; max-width: 60vw; padding: 7px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface-2); color: var(--text); font-size: 14px; }
  .search .results { position: absolute; right: 0; top: 38px; width: 420px; max-width: 90vw; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 8px 30px rgba(0,0,0,.12); max-height: 60vh; overflow: auto; display: none; }
  .search .results a { display: flex; justify-content: space-between; gap: 10px; padding: 8px 12px; color: var(--text); border-bottom: 1px solid var(--border); }
  .search .results a:hover { background: var(--surface-2); text-decoration: none; }
  .search .results .k { color: var(--text-3); font-size: 12px; white-space: nowrap; }
  main { max-width: 1180px; margin: 0 auto; padding: 20px 16px 60px; }
  h1 { font-size: 26px; margin: 6px 0 4px; letter-spacing: -.02em; } h2 { font-size: 17px; margin: 28px 0 10px; } h3 { font-size: 15px; margin: 18px 0 8px; color: var(--text-2); }
  .sub { color: var(--text-2); margin: 0 0 14px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 14px 0; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
  .tile .v { font-size: 24px; font-weight: 700; letter-spacing: -.02em; } .tile .l { color: var(--text-2); font-size: 13px; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 10px 0 6px; }
  .chip { border: 1px solid var(--border); background: var(--surface); color: var(--text-2); border-radius: 999px; padding: 4px 11px; font-size: 13px; cursor: pointer; }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chip-group { display: flex; gap: 6px; flex-wrap: wrap; } .controls .lbl { color: var(--text-3); font-size: 13px; margin-left: 6px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; } @media (max-width: 860px) { .grid2 { grid-template-columns: 1fr; } }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
  .card h2 { margin-top: 0; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; } th { text-align: left; color: var(--text-3); font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; padding: 6px 8px; border-bottom: 1px solid var(--border); }
  td { padding: 6px 8px; border-bottom: 1px solid var(--grid); vertical-align: top; } td.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; width: 1%; } th.n { text-align: right; }
  tr:hover td { background: var(--surface-2); }
  .muted { color: var(--text-3); } .small { font-size: 13px; } .tag { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--surface-2); color: var(--text-2); border: 1px solid var(--border); margin-left: 6px; vertical-align: middle; }
  .hbar { display: flex; align-items: center; gap: 8px; } .hbar .track { flex: 1; height: 10px; background: var(--surface-2); border-radius: 4px; overflow: hidden; } .hbar .fill { height: 100%; background: var(--bar); border-radius: 0 4px 4px 0; }
  .chart { position: relative; height: 240px; } .chart.tall { height: 340px; }
  .cite { padding: 10px 0; border-bottom: 1px solid var(--grid); }
  .cite .t { font-weight: 600; } .cite .ctx { color: var(--text-2); font-size: 13.5px; margin: 2px 0; font-style: italic; } .cite .raw { color: var(--text-3); font-size: 13px; }
  .cite .meta { color: var(--text-3); font-size: 12.5px; }
  details summary { cursor: pointer; color: var(--text-2); } details { margin: 6px 0; }
  .banner { background: var(--accent-soft); border-radius: 10px; padding: 10px 14px; margin: 10px 0; font-size: 14px; }
  select { padding: 6px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); font-size: 14px; }
  .two { columns: 2; column-gap: 24px; } @media (max-width: 700px) { .two { columns: 1; } }
  .nowrap { white-space: nowrap; } .right { text-align: right; }
  footer { color: var(--text-3); font-size: 13px; max-width: 1180px; margin: 0 auto; padding: 0 16px 40px; }
  .loading { color: var(--text-3); padding: 40px 0; text-align: center; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>
<header><div class="bar">
  <a class="brand" href="#/">Conference Bibliography <small>who gets quoted in general conference</small></a>
  <nav>
    <a href="#/" data-nav="home">Overview</a>
    <a href="#/persons" data-nav="persons">People</a>
    <a href="#/works" data-nav="works">Works</a>
    <a href="#/conferences" data-nav="conferences">Conferences</a>
    <a href="#/scripture" data-nav="scripture">Scripture</a>
    <a href="#/about" data-nav="about">About</a>
  </nav>
  <div class="search"><input id="q" type="search" placeholder="Search a person or work…" autocomplete="off"><div class="results" id="qres"></div></div>
</div></header>
<main id="app"><div class="loading">Loading…</div></main>
<footer id="foot"></footer>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = n => (n ?? 0).toLocaleString();
const talkUrl = uri => `https://www.churchofjesuschrist.org/study${uri}?lang=eng`;
const confLabel = key => { const [y, m] = key.split("-"); return `${m === "04" ? "Apr" : "Oct"} ${y}`; };
const DECADES = ["1970s", "1980s", "1990s", "2000s", "2010s", "2020s"];
const KIND_LABEL = { external: "outside author", church_leader: "Church leader", scripture_figure: "scripture figure" };
let DATA = null, CITS = null, TALK = {}, PERSON = {}, WORK = {};
const state = { decades: new Set(), kind: "external", quotedOnly: false, workType: "book" };
async function loadJson(path) { const r = await fetch(path); if (!r.ok) throw new Error(path); return r.json(); }
async function citations() {
  if (!CITS) { CITS = await loadJson("data/citations.json"); }
  return CITS;
}
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const personName = c => c.p ? (PERSON[c.p]?.name ?? "?") : c.pn;
const workName = c => c.w ? (WORK[c.w]?.title ?? DATA.containers[c.w] ?? "?") : c.wn;

// ------------------------------------------------------------------ charts
const charts = [];
function destroyCharts() { while (charts.length) charts.pop().destroy(); }
function baseOpts(extra = {}) {
  Chart.defaults.color = css("--text-2"); Chart.defaults.borderColor = css("--grid"); Chart.defaults.font.family = getComputedStyle(document.body).fontFamily;
  return { responsive: true, maintainAspectRatio: false, animation: false,
    plugins: { legend: { display: false }, tooltip: { backgroundColor: css("--surface"), titleColor: css("--text"), bodyColor: css("--text-2"), borderColor: css("--border"), borderWidth: 1 } },
    scales: { x: { grid: { display: false }, ticks: { maxRotation: 0, autoSkip: true, maxTicksLimit: 14 } }, y: { beginAtZero: true, grid: { color: css("--grid") }, ticks: { precision: 0 } } }, ...extra };
}
function barChart(canvas, labels, values, opts = {}) {
  const c = new Chart(canvas, { type: "bar", data: { labels, datasets: [{ data: values, backgroundColor: css("--bar"), borderRadius: 3, maxBarThickness: 28, label: opts.label || "citations" }] },
    options: baseOpts(opts.options || {}) });
  charts.push(c); return c;
}
function confSeries(list) {
  const ctr = {}; list.forEach(c => { const k = TALK[c.t].conf; ctr[k] = (ctr[k] || 0) + 1; });
  return { labels: DATA.conferences.map(c => confLabel(c.key)), values: DATA.conferences.map(c => ctr[c.key] || 0) };
}

// ------------------------------------------------------------------ helpers
function filteredPersons() {
  let list = DATA.persons;
  if (state.kind !== "all") list = list.filter(p => p.kind === state.kind);
  const decs = state.decades.size ? [...state.decades] : null;
  return list.map(p => ({ ...p, n: decs ? decs.reduce((a, d) => a + (p.by_decade[d] || 0), 0) : (state.quotedOnly ? p.quoted : p.total) }))
             .filter(p => p.n > 0).sort((a, b) => b.n - a.n);
}
function filteredWorks(pred) {
  let list = DATA.works.filter(pred || (() => true));
  const decs = state.decades.size ? [...state.decades] : null;
  return list.map(w => ({ ...w, n: decs ? decs.reduce((a, d) => a + (w.by_decade[d] || 0), 0) : w.total })).filter(w => w.n > 0).sort((a, b) => b.n - a.n);
}
function controlsHtml({ kinds = true, decades = true, quoted = true } = {}) {
  return `<div class="controls">
    ${decades ? `<span class="lbl">Decade</span><div class="chip-group" id="decades">${["All", ...DECADES].map(d => `<button class="chip ${d === "All" ? (state.decades.size ? "" : "on") : (state.decades.has(d) ? "on" : "")}" data-d="${d}">${d}</button>`).join("")}</div>` : ""}
    ${kinds ? `<span class="lbl">Who</span><div class="chip-group" id="kinds">${[["external", "Outside authors"], ["church_leader", "Church leaders"], ["scripture_figure", "Scripture figures"], ["all", "Everyone"]].map(([k, l]) => `<button class="chip ${state.kind === k ? "on" : ""}" data-k="${k}">${l}</button>`).join("")}</div>` : ""}
    ${quoted ? `<button class="chip ${state.quotedOnly ? "on" : ""}" id="quotedOnly" title="Count only notes that quote the person, not 'see also' references">Quoted only</button>` : ""}
  </div>`;
}
function bindControls(rerender) {
  $("#decades")?.addEventListener("click", e => { const d = e.target.dataset.d; if (!d) return; if (d === "All") state.decades.clear(); else state.decades.has(d) ? state.decades.delete(d) : state.decades.add(d); rerender(); });
  $("#kinds")?.addEventListener("click", e => { const k = e.target.dataset.k; if (!k) return; state.kind = k; rerender(); });
  $("#quotedOnly")?.addEventListener("click", () => { state.quotedOnly = !state.quotedOnly; rerender(); });
}
function rankTable(rows, { nameOf, hrefOf, metaOf, max = 25, label = "citations" }) {
  const top = rows.slice(0, max); const mx = top[0]?.n || 1;
  if (!top.length) return '<p class="muted small">Nothing to show.</p>';
  return `<div style="overflow-x:auto"><table><thead><tr><th style="width:2em">#</th><th>Name</th><th></th><th class="n">${label}</th></tr></thead><tbody>${top.map((r, i) => `<tr><td class="muted">${i + 1}</td><td><a href="${hrefOf(r)}">${esc(nameOf(r))}</a>${metaOf && metaOf(r) ? `<span class="tag">${esc(metaOf(r))}</span>` : ""}</td><td style="width:30%"><div class="hbar"><div class="track"><div class="fill" style="width:${100 * r.n / mx}%"></div></div></div></td><td class="n">${fmt(r.n)}</td></tr>`).join("")}</tbody></table></div>`;
}
function countBy(list, keyOf, nameOf, max = 15) {
  const ctr = new Map();
  list.forEach(c => { const k = keyOf(c); if (k) ctr.set(k, (ctr.get(k) || 0) + 1); });
  return [...ctr.entries()].map(([k, n]) => ({ id: k, name: nameOf(k), n })).sort((a, b) => b.n - a.n).slice(0, max);
}
function citationHtml(c, { showPerson = true, showWork = true } = {}) {
  const t = TALK[c.t];
  return `<div class="cite">
    <div class="t"><a href="${talkUrl(t.uri)}" target="_blank" rel="noopener">${esc(t.title)}</a> <span class="muted small">— ${esc(t.speaker)}, <a href="#/conference/${t.conf}">${confLabel(t.conf)}</a>${t.session ? `, ${esc(t.session)}` : ""}</span></div>
    ${c.cx ? `<div class="ctx">…${esc(c.cx)}</div>` : ""}
    <div class="raw">${esc(c.x)}</div>
    <div class="meta">${c.r === "see" ? "cited for support" : c.r === "secondary" ? "quoted via another source" : "quoted"}${showPerson && c.p ? ` · <a href="#/person/${c.p}">${esc(personName(c))}</a>` : ""}${showWork && c.w ? ` · <a href="#/work/${c.w}">${esc(workName(c))}</a>` : ""}${c.wt ? ` · ${esc(c.wt)}` : ""}${c.cf < 0.6 ? ` · <span title="the parser was unsure about this one">low confidence</span>` : ""}</div>
  </div>`;
}
function groupedCitations(list, opts) {
  const groups = {}; list.forEach(c => (groups[TALK[c.t].conf] ||= []).push(c));
  const keys = Object.keys(groups).sort().reverse();
  return keys.map(k => `<details ${keys.length < 6 ? "open" : ""}><summary><b>${confLabel(k)}</b> · ${groups[k].length}</summary>${groups[k].map(c => citationHtml(c, opts)).join("")}</details>`).join("");
}
function coverageBanner() {
  const partial = DATA.conferences.filter(c => c.talks_extracted < c.talks);
  if (!partial.length) return "";
  return `<div class="banner">Partial coverage: ${partial.length} conference${partial.length > 1 ? "s" : ""} not fully processed (${partial.slice(0, 6).map(c => confLabel(c.key)).join(", ")}${partial.length > 6 ? "…" : ""}). Counts are lower bounds.</div>`;
}
const loading = () => { $("#app").innerHTML = '<div class="loading">Loading citations…</div>'; };

// ------------------------------------------------------------------ views
function viewHome() {
  const t = DATA.totals;
  const first = DATA.conferences[0], last = DATA.conferences[DATA.conferences.length - 1];
  const persons = filteredPersons();
  const works = filteredWorks(w => !["talk", "scripture", "periodical", "hymnal", "manual", "study_help", "other", "web"].includes(w.type) && (state.kind === "all" || PERSON[w.author_id]?.kind === state.kind || (state.kind === "external" && !w.author_id)));
  const talksCited = filteredWorks(w => w.type === "talk");
  $("#app").innerHTML = `
    <h1>Who gets quoted in general conference</h1>
    <p class="sub">Every footnote and inline citation in ${fmt(t.talks)} talks, ${confLabel(first.key)} – ${confLabel(last.key)}, turned inside out: for each author and work, who cited it, when, and how often.</p>
    ${coverageBanner()}
    <div class="tiles">
      <div class="tile"><div class="v">${fmt(t.talks)}</div><div class="l">talks</div></div>
      <div class="tile"><div class="v">${fmt(t.counted)}</div><div class="l">non-scripture citations</div></div>
      <div class="tile"><div class="v">${fmt(t.scripture)}</div><div class="l">scripture references</div></div>
      <div class="tile"><div class="v">${fmt(t.external_citations)}</div><div class="l">quotes from outside authors</div></div>
      <div class="tile"><div class="v">${fmt(t.persons)}</div><div class="l">people quoted</div></div>
      <div class="tile"><div class="v">${fmt(t.works)}</div><div class="l">works cited</div></div>
    </div>
    ${controlsHtml()}
    <div class="grid2">
      <div class="card"><h2>Most-quoted ${state.kind === "all" ? "people" : KIND_LABEL[state.kind] + "s"}</h2>${rankTable(persons, { nameOf: p => p.name, hrefOf: p => `#/person/${p.id}`, max: 30 })}<p class="small"><a href="#/persons">All ${fmt(persons.length)} →</a></p></div>
      <div class="card"><h2>Most-cited books, plays, poems, articles</h2>${rankTable(works, { nameOf: w => w.title, hrefOf: w => `#/work/${w.id}`, metaOf: w => w.author || w.type, max: 30 })}<p class="small"><a href="#/works">All works →</a></p></div>
    </div>
    <div class="grid2" style="margin-top:18px">
      <div class="card"><h2>Citations per conference</h2><p class="sub small">Non-scripture citations in each conference's talks. Footnotes only became standard in 1996, so earlier counts rest on inline parenthetical citations.</p><div class="chart"><canvas id="confChart"></canvas></div></div>
      <div class="card"><h2>Most-cited earlier talks</h2>${rankTable(talksCited, { nameOf: w => w.title, hrefOf: w => `#/work/${w.id}`, metaOf: w => w.author || "", max: 15 })}</div>
    </div>`;
  bindControls(viewHome);
  destroyCharts();
  barChart($("#confChart"), DATA.conferences.map(c => confLabel(c.key)), DATA.conferences.map(c => c.citations));
}

function viewPersons() {
  const persons = filteredPersons();
  $("#app").innerHTML = `<h1>People quoted</h1><p class="sub">${fmt(persons.length)} people. Counts are non-scripture citations in which the person's words are used.</p>${controlsHtml()}
    <div class="card">${rankTable(persons, { nameOf: p => p.name, hrefOf: p => `#/person/${p.id}`, metaOf: p => `${p.first_year}–${p.last_year}`, max: 300 })}</div>`;
  bindControls(viewPersons);
}
function viewWorks() {
  const types = ["book", "play", "poem", "article", "hymn", "talk", "speech", "manual", "chapter", "periodical", "web", "other"];
  const sel = state.workType;
  const works = filteredWorks(w => sel === "all" ? true : sel === "other" ? !types.includes(w.type) || w.type === "other" : w.type === sel);
  $("#app").innerHTML = `<h1>Works cited</h1>${controlsHtml({ kinds: false, quoted: false })}
    <div class="controls"><span class="lbl">Type</span><div class="chip-group" id="types">${["all", ...types].map(t => `<button class="chip ${sel === t ? "on" : ""}" data-t="${t}">${t === "all" ? "Everything" : t}</button>`).join("")}</div></div>
    <div class="card">${rankTable(works, { nameOf: w => w.title, hrefOf: w => `#/work/${w.id}`, metaOf: w => w.author || w.type, max: 300 })}</div>`;
  bindControls(viewWorks);
  $("#types").addEventListener("click", e => { if (e.target.dataset.t) { state.workType = e.target.dataset.t; viewWorks(); } });
}

async function viewPerson(id) {
  id = Number(id); const p = PERSON[id];
  if (!p) { $("#app").innerHTML = '<div class="banner">Unknown person.</div>'; return; }
  loading(); const all = await citations();
  const list = all.filter(c => c.p === id);
  const series = confSeries(list);
  const byDecade = {}; list.forEach(c => { const d = `${Math.floor(TALK[c.t].year / 10) * 10}s`; byDecade[d] = (byDecade[d] || 0) + 1; });
  const worksList = countBy(list, c => c.w, k => WORK[k]?.title ?? DATA.containers[k] ?? "?", 40);
  const speakers = countBy(list, c => TALK[c.t].speaker, k => k, 25);
  $("#app").innerHTML = `
    <p class="small"><a href="#/persons">← People</a></p>
    <h1>${esc(p.name)} <span class="tag">${KIND_LABEL[p.kind] || p.kind}</span></h1>
    <p class="sub">${fmt(p.total)} citations in ${fmt(p.talks)} talks${p.aliases.length > 1 ? ` · also written as ${p.aliases.filter(a => a !== p.name).slice(0, 6).map(esc).join(", ")}` : ""}</p>
    <div class="tiles">${DECADES.map(d => `<div class="tile"><div class="v">${fmt(byDecade[d] || 0)}</div><div class="l">${d}</div></div>`).join("")}</div>
    <div class="card"><h2>Citations by conference</h2><div class="chart"><canvas id="c1"></canvas></div></div>
    <div class="grid2" style="margin-top:18px">
      <div class="card"><h2>Works cited</h2>${worksList.length ? rankTable(worksList, { nameOf: w => w.name, hrefOf: w => `#/work/${w.id}`, metaOf: w => WORK[w.id]?.type, max: 40 }) : '<p class="muted">No specific work recorded.</p>'}</div>
      <div class="card"><h2>Speakers who cite ${esc(p.name.split(" ").slice(-1)[0])}</h2><table><tbody>${speakers.map(s => `<tr><td>${esc(s.name)}</td><td class="n">${s.n}</td></tr>`).join("")}</tbody></table></div>
    </div>
    <h2>Every citation</h2>${groupedCitations(list, { showPerson: false })}`;
  destroyCharts();
  barChart($("#c1"), series.labels, series.values);
}

async function viewWork(id) {
  id = Number(id); const w = WORK[id];
  if (!w) { $("#app").innerHTML = '<div class="banner">Unknown work.</div>'; return; }
  loading(); const all = await citations();
  const list = all.filter(c => c.w === id || c.c === id);
  const series = confSeries(list);
  const persons = countBy(list, c => c.p, k => PERSON[k]?.name ?? "?", 20);
  $("#app").innerHTML = `
    <p class="small"><a href="#/works">← Works</a></p>
    <h1>${esc(w.title)} <span class="tag">${esc(w.type)}</span></h1>
    <p class="sub">${w.author ? `by <a href="#/person/${w.author_id}">${esc(w.author)}</a> · ` : ""}${fmt(list.length)} citations${w.cited_talk_uri ? ` · <a href="${talkUrl(w.cited_talk_uri)}" target="_blank" rel="noopener">read the talk ↗</a>` : ""}${w.aliases.length > 1 ? ` · also cited as ${w.aliases.filter(a => a !== w.title).slice(0, 5).map(esc).join("; ")}` : ""}</p>
    <div class="card"><h2>Citations by conference</h2><div class="chart"><canvas id="c1"></canvas></div></div>
    ${persons.length > 1 ? `<div class="card" style="margin-top:18px"><h2>Whose words</h2>${rankTable(persons, { nameOf: p => p.name, hrefOf: p => `#/person/${p.id}`, max: 20 })}</div>` : ""}
    <h2>Every citation</h2>${groupedCitations(list, { showWork: false })}`;
  destroyCharts();
  barChart($("#c1"), series.labels, series.values);
}

function viewConferences() {
  const rows = [...DATA.conferences].reverse();
  $("#app").innerHTML = `<h1>Conferences</h1><p class="sub">Pick a conference to see its sessions, talks, and who was quoted.</p>
    <div class="card" style="overflow-x:auto"><table><thead><tr><th>Conference</th><th class="n">Talks</th><th class="n">Citations</th><th class="n">Scripture</th><th class="n">Outside</th><th>Most quoted</th></tr></thead><tbody>
    ${rows.map(c => `<tr><td class="nowrap"><a href="#/conference/${c.key}">${confLabel(c.key)}</a>${c.talks_extracted < c.talks ? '<span class="tag">partial</span>' : ""}</td><td class="n">${c.talks}</td><td class="n">${fmt(c.citations)}</td><td class="n">${fmt(c.scripture)}</td><td class="n">${fmt(c.external)}</td><td class="small">${c.top_persons.slice(0, 4).map(p => `<a href="#/person/${p.id}">${esc(p.name)}</a> (${p.n})`).join(", ")}</td></tr>`).join("")}
    </tbody></table></div>`;
}

async function viewConference(key) {
  const conf = DATA.conferences.find(x => x.key === key);
  if (!conf) { $("#app").innerHTML = '<div class="banner">Unknown conference.</div>'; return; }
  loading(); const all = await citations();
  const talks = DATA.talks.filter(t => t.conf === key);
  const tids = new Set(talks.map(t => t.id));
  const list = all.filter(c => tids.has(c.t));
  const idx = DATA.conferences.indexOf(conf);
  const prev = DATA.conferences[idx - 1], next = DATA.conferences[idx + 1];
  const sessions = []; talks.forEach(t => { let s = sessions.find(x => x.title === t.session); if (!s) sessions.push(s = { title: t.session, talks: [] }); s.talks.push(t); });
  const pname = k => PERSON[k]?.name ?? "?", wname = k => WORK[k]?.title ?? DATA.containers[k] ?? "?";
  const external = list.filter(c => PERSON[c.p]?.kind === "external");
  $("#app").innerHTML = `
    <p class="small"><a href="#/conferences">← Conferences</a> ${prev ? `· <a href="#/conference/${prev.key}">‹ ${confLabel(prev.key)}</a>` : ""} ${next ? `· <a href="#/conference/${next.key}">${confLabel(next.key)} ›</a>` : ""}</p>
    <h1>${esc(conf.title)}</h1>
    <div class="tiles">
      <div class="tile"><div class="v">${conf.talks}</div><div class="l">talks</div></div>
      <div class="tile"><div class="v">${fmt(conf.citations)}</div><div class="l">non-scripture citations</div></div>
      <div class="tile"><div class="v">${fmt(conf.scripture)}</div><div class="l">scripture references</div></div>
      <div class="tile"><div class="v">${fmt(conf.external)}</div><div class="l">quotes from outside authors</div></div>
    </div>
    <div class="grid2">
      <div class="card"><h2>Most quoted this conference</h2>${rankTable(countBy(list, c => c.p, pname, 10), { nameOf: p => p.name, hrefOf: p => `#/person/${p.id}`, metaOf: p => PERSON[p.id]?.kind === "external" ? "outside" : "", max: 10 })}
        ${external.length ? `<p class="small muted">Outside authors: ${countBy(external, c => c.p, pname, 10).map(p => `<a href="#/person/${p.id}">${esc(p.name)}</a> (${p.n})`).join(", ")}</p>` : ""}</div>
      <div class="card"><h2>Most-cited works</h2>${rankTable(countBy(list, c => c.w, wname, 10), { nameOf: w => w.name, hrefOf: w => `#/work/${w.id}`, metaOf: w => WORK[w.id]?.type, max: 10 })}</div>
    </div>
    ${sessions.map(s => {
      const sids = new Set(s.talks.map(t => t.id)); const sl = list.filter(c => sids.has(c.t));
      const top = countBy(sl, c => c.p, pname, 6);
      return `<h2>${esc(s.title)} <span class="muted small">· ${fmt(sl.length)} citations, ${fmt(s.talks.reduce((a, t) => a + t.s.length, 0))} scripture</span></h2>
      ${top.length ? `<p class="small muted">Most quoted in this session: ${top.map(p => `<a href="#/person/${p.id}">${esc(p.name)}</a> (${p.n})`).join(", ")}</p>` : ""}
      ${s.talks.map(t => { const items = sl.filter(c => c.t === t.id); return `<details><summary><b>${esc(t.title)}</b> — ${esc(t.speaker)} <span class="muted">· ${items.length} citations, ${t.s.length} scripture · <a href="${talkUrl(t.uri)}" target="_blank" rel="noopener">read ↗</a></span></summary>
        ${items.map(i => citationHtml(i)).join("") || '<p class="muted small">No non-scripture citations.</p>'}
        ${t.s.length ? `<p class="small muted">Scripture: ${t.s.map(esc).join("; ")}</p>` : ""}
      </details>`; }).join("")}`; }).join("")}`;
}

function viewScripture() {
  const vols = ["Old Testament", "New Testament", "Book of Mormon", "Doctrine and Covenants", "Pearl of Great Price"];
  const decs = state.decades.size ? [...state.decades] : null;
  const books = DATA.scripture.map(b => ({ ...b, n: decs ? decs.reduce((a, d) => a + (b.by_decade[d] || 0), 0) : b.total })).filter(b => b.n > 0).sort((a, b) => b.n - a.n);
  const byVol = {}; books.forEach(b => byVol[b.volume] = (byVol[b.volume] || 0) + b.n);
  $("#app").innerHTML = `<h1>Scripture</h1><p class="sub">${fmt(DATA.totals.scripture)} scripture references, parsed from the hyperlinks in every note. Shown separately because they would otherwise swamp every other count.</p>
    ${controlsHtml({ kinds: false, quoted: false })}
    <div class="tiles">${vols.map(v => `<div class="tile"><div class="v">${fmt(byVol[v] || 0)}</div><div class="l">${v}</div></div>`).join("")}</div>
    <div class="card"><h2>Books</h2><div class="chart tall"><canvas id="c1"></canvas></div></div>
    <div class="grid2" style="margin-top:18px">
      <div class="card"><h2>Most-cited chapters</h2><table><tbody>${books.flatMap(b => b.top_chapters).sort((a, b) => b[1] - a[1]).slice(0, 25).map(([k, n]) => `<tr><td>${esc(k)}</td><td class="n">${n}</td></tr>`).join("")}</tbody></table></div>
      <div class="card"><h2>Most-cited passages</h2><table><tbody>${books.flatMap(b => b.top_passages).sort((a, b) => b[1] - a[1]).slice(0, 25).map(([k, n]) => `<tr><td>${esc(k)}</td><td class="n">${n}</td></tr>`).join("")}</tbody></table></div>
    </div>`;
  bindControls(viewScripture);
  destroyCharts();
  const top = books.slice(0, 30);
  barChart($("#c1"), top.map(b => b.book), top.map(b => b.n), { options: { indexAxis: "y", scales: { x: { beginAtZero: true, grid: { color: css("--grid") } }, y: { grid: { display: false }, ticks: { autoSkip: false } } } } });
}

function viewAbout() {
  const t = DATA.totals;
  $("#app").innerHTML = `<h1>About</h1>
  <div class="card" style="max-width:820px">
  <p>This is a <b>reverse bibliography</b> of general conference of The Church of Jesus Christ of Latter-day Saints. A normal bibliography lists what one talk cites. This flips it: for every author and work, it lists every talk that cited it, from April 1971 (the earliest conference published online) to the present.</p>
  <h3>How it is built</h3>
  <p>Each talk is fetched from the Gospel Library's public JSON, which already marks scripture links, cross-references to other talks and manuals, and the footnotes. Scripture and cross-reference links are read directly from the hyperlinks. Everything else (books, plays, poems, articles) is parsed from the footnote text by a rule-based parser written for the Church magazines' Chicago-style citations, with Claude re-reading the notes the rules were unsure about. Talks before 1996 have no footnotes; their citations sit inline in parentheses and are parsed the same way.</p>
  <p>Spelling variants of a name or title are merged automatically and with a hand-curated alias list. A citation that begins with “See” is counted as <i>cited for support</i>; one introduced by “in” or “quoted in” records both the person quoted and the source the quote came through.</p>
  <h3>How to read the numbers</h3>
  <p>A count is the number of footnotes or inline citations, not the number of distinct quotations: a talk that quotes C. S. Lewis three times with three footnotes counts three. “Quoted only” excludes “see also” references. Scripture is shown on its own page because it accounts for ${Math.round(100 * t.scripture / t.citations)}% of all references. Low-confidence parses are marked in the citation lists; expect some noise in the long tail.</p>
  <h3>Totals</h3>
  <p>${fmt(t.talks)} talks · ${fmt(t.citations)} citation records · ${fmt(t.counted)} non-scripture · ${fmt(t.scripture)} scripture · ${fmt(t.persons)} people · ${fmt(t.works)} works. Generated ${esc(DATA.generated_at)}. Source code: <a href="https://github.com/cahlan/general-conference-bibliography" target="_blank" rel="noopener">github.com/cahlan/general-conference-bibliography</a>.</p>
  </div>`;
}

// ------------------------------------------------------------------ search
function bindSearch() {
  const q = $("#q"), res = $("#qres");
  const index = [...DATA.persons.map(p => ({ kind: "person", id: p.id, name: p.name, meta: `${KIND_LABEL[p.kind] || p.kind} · ${p.total}`, key: p.name.toLowerCase(), n: p.total })),
                 ...DATA.works.map(w => ({ kind: "work", id: w.id, name: w.title, meta: `${w.type}${w.author ? " · " + w.author : ""} · ${w.total}`, key: (w.title + " " + (w.author || "")).toLowerCase(), n: w.total }))];
  q.addEventListener("input", () => {
    const s = q.value.trim().toLowerCase();
    if (s.length < 2) { res.style.display = "none"; return; }
    const hits = index.filter(x => x.key.includes(s)).sort((a, b) => (b.key.startsWith(s) - a.key.startsWith(s)) || b.n - a.n).slice(0, 20);
    res.innerHTML = hits.map(h => `<a href="#/${h.kind}/${h.id}"><span>${esc(h.name)}</span><span class="k">${esc(h.meta)}</span></a>`).join("") || `<a><span class="muted">No matches</span></a>`;
    res.style.display = "block";
  });
  q.addEventListener("blur", () => setTimeout(() => res.style.display = "none", 150));
  q.addEventListener("focus", () => { if (q.value.trim().length >= 2) res.style.display = "block"; });
  q.addEventListener("keydown", e => { if (e.key === "Enter") { const a = res.querySelector("a[href]"); if (a) { location.hash = a.getAttribute("href"); res.style.display = "none"; } } });
}

// ------------------------------------------------------------------ router
async function route() {
  const h = location.hash.replace(/^#\/?/, "");
  const [view, arg] = h.split("/");
  document.querySelectorAll("nav a").forEach(a => a.classList.toggle("active", a.dataset.nav === (view || "home")));
  window.scrollTo(0, 0);
  try {
    if (!view) viewHome();
    else if (view === "persons") viewPersons();
    else if (view === "works") viewWorks();
    else if (view === "person") await viewPerson(arg);
    else if (view === "work") await viewWork(arg);
    else if (view === "conferences") viewConferences();
    else if (view === "conference") await viewConference(arg);
    else if (view === "scripture") viewScripture();
    else if (view === "about") viewAbout();
    else viewHome();
  } catch (e) { $("#app").innerHTML = `<div class="banner">Could not load this page (${esc(e.message)}).</div>`; }
}
(async function init() {
  try { DATA = await loadJson("data/index.json"); }
  catch (e) { $("#app").innerHTML = `<div class="banner">No data yet. Run <code>python -m gcbib run all</code> then <code>python -m gcbib serve</code>.</div>`; return; }
  DATA.talks.forEach(t => TALK[t.id] = t); DATA.persons.forEach(p => PERSON[p.id] = p); DATA.works.forEach(w => WORK[w.id] = w);
  $("#foot").textContent = `Data from churchofjesuschrist.org · generated ${DATA.generated_at}`;
  bindSearch();
  window.addEventListener("hashchange", route);
  route();
  citations().catch(() => {});   // warm the detail data in the background
})();
</script>
</body>
